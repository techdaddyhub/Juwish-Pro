name: Build JuwishPro Production Mobile App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # NATIVE ANDROID BUILD (APK) - Mobile App
  # -------------------------------------------------------------
  build-android:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow & Generate JuwishPro Icons
        run: |
          pip install Pillow
          python3 android/scripts/generate_android_icons.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: JuwishPro-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
