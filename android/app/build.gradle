plugins {
    id 'com.android.application'
}

android {
    namespace 'org.dmillers.juwishpro'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "role"
    productFlavors {
        client {
            dimension "role"
            applicationId "org.dmillers.juwishpro"
            manifestPlaceholders = [appName: "JuwishPro"]
            buildConfigField "String", "TARGET_URL", "\"https://2026.dmillers.org\""
        }
        admin {
            dimension "role"
            applicationId "org.dmillers.juwishpro.admin"
            manifestPlaceholders = [appName: "JuwishPro Admin"]
            buildConfigField "String", "TARGET_URL", "\"https://2026.dmillers.org/admin\""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.activity:activity:1.8.2'
}
