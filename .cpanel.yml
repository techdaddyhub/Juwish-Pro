---
deployment:
  tasks:
    - export DEPLOYPATH=/home/$USER/public_html/2026.dmillers.org/
    - if [ ! -d "$DEPLOYPATH" ]; then export DEPLOYPATH=/home/$USER/2026.dmillers.org/; fi
    - /bin/cp -R * $DEPLOYPATH
    - /bin/chmod -R 755 $DEPLOYPATH
    - /bin/chmod -R 775 $DEPLOYPATH/storage
    - /bin/chmod -R 775 $DEPLOYPATH/bootstrap/cache

