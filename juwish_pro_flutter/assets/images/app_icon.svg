<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Night Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1E232F"/>
      <stop offset="55%" stop-color="#12151C"/>
      <stop offset="100%" stop-color="#080A0D"/>
    </radialGradient>

    <!-- Metallic Gold Rim Gradient -->
    <radialGradient id="goldRim" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="22%" stop-color="#FCD535"/>
      <stop offset="58%" stop-color="#F0B90B"/>
      <stop offset="85%" stop-color="#C28600"/>
      <stop offset="100%" stop-color="#734F00"/>
    </radialGradient>

    <!-- Laravel Red Vibrant Gradient -->
    <linearGradient id="laravelRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5D52"/>
      <stop offset="40%" stop-color="#FF2D20"/>
      <stop offset="100%" stop-color="#D81E12"/>
    </linearGradient>

    <!-- Drop Shadow & Neon Glow -->
    <filter id="laravelGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#FF2D20" flood-opacity="0.5"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F0B90B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Solid Background (iOS/Android Safe) -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Outer Beveled Squircle Gold Ring -->
  <rect x="36" y="36" width="952" height="952" rx="212" fill="none" stroke="url(#goldRim)" stroke-width="8"/>
  <rect x="48" y="48" width="928" height="928" rx="200" fill="none" stroke="#F0B90B" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="14,8"/>

  <!-- Concentric Tech Nodes / Microdots -->
  <circle cx="512" cy="455" r="350" fill="none" stroke="#F0B90B" stroke-width="1.5" stroke-opacity="0.2"/>
  <circle cx="512" cy="455" r="395" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="6,8"/>

  <!-- Centered Laravel Origami Mark -->
  <g transform="translate(136, 85) scale(0.4)" filter="url(#laravelGlow)">
    <path fill="url(#laravelRed)" d="M791.5 1714L215 1381.5c-8.5-5.5-15-8.5-15-19.5V357.5c0-8.158 5-13.5 9.5-16L502 173c9.5-5.5 17.5-5.5 26.5 0L819 340c11.5 6.5 12 15 12 22.5v622L1073.5 845V527c0-11 5-17.5 17-24.5L1380 336c7-4 12.5-4 19.5 0l295 170c9.5 5.5 10.5 12 10.5 21.5V858c0 10.5-2.5 16-13 22.5l-278.5 160v317c0 12.5-3 17.5-14 24L821 1714c-11 6-18.5 6-29.5 0zm-9-61.5v-279l-276-156c-9-5.5-15.5-9.5-15.5-23V543L248 403.5V1345zm583-307.5v-277L831 1373.5v279zm-25.528-318.167L1098 886.5 565 1194l241 137zM782.5 1012V403L540 543v609zm583-28V708l-243-140v277zm291-139V568l-243 140v276zm-267-179.5l242-139.5-242-139.5L1147 526zM757.635 361.004L515 221.5 273 361l242 140z"/>
  </g>

  <!-- Sleek Typography -->
  <text x="512" y="845" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#F0B90B" text-anchor="middle" letter-spacing="9" filter="url(#goldGlow)">JUWISHPRO</text>
  <text x="512" y="895" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#EAECEF" text-anchor="middle" letter-spacing="7" opacity="0.85">LARAVEL EDITION</text>
</svg>